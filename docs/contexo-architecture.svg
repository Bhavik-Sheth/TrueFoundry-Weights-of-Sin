<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 594" width="1000" height="594" role="img" aria-labelledby="contexo-architecture-title contexo-architecture-desc">
  <title id="contexo-architecture-title">Contexo architecture on TrueForge</title>
  <desc id="contexo-architecture-desc">VS Code and the terminal connect through a session client to TrueForge. TrueForge controls inference, model fallback and tool approval. Authenticated loopback MCP connects the runtime to workspace tools and the context index. The session client hands edit proposals to local review. Accepted hunks reach the working tree, candidate tests use a separate copy, and the evidence store stores evidence and recovery checkpoints.</desc>

